[package]
name = "salmon"
kind = "tool"
version = "2.12.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/salmon"

[command]
name = "taf-salmon"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/salmon:2.12.0-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["rna-seq", "transcriptomics", "quantification", "alignment", "indexing"]
keywords = ["salmon", "rna-seq", "transcript abundance", "selective alignment", "sketch", "sshash", "canonical k-mer", "piscem", "quant", "quantmerge", "adaptive threading", "FIFO", "streaming"]
description = "Salmon transcript-level RNA-seq quantification with the Salmon 2 Rust CLI, index-format-v3 canonical k-mer dictionaries, selective-alignment and sketch modes, RAD workflows, mapping export, alignment-based quantification, and quantification merging."

[upstream]
name = "Salmon"
type = "github"
repo = "COMBINE-lab/salmon"
homepage = "https://combine-lab.github.io/salmon/"
manual = "https://combine-lab.github.io/salmon/"
release_url = "https://github.com/COMBINE-lab/salmon/releases/tag/v2.12.0"
downloads = "https://github.com/COMBINE-lab/salmon/releases/download/v2.12.0/salmon-cli-x86_64-unknown-linux-gnu.tar.xz; https://github.com/COMBINE-lab/salmon/releases/download/v2.12.0/salmon-cli-aarch64-unknown-linux-gnu.tar.xz"
version = "2.12.0"
commit = "d71d1331371d29073006220369cbc48ff1802040"
license = "BSD-3-Clause"
citation = "Patro et al. 2017, Nature Methods"
doi = "10.1038/nmeth.4197"
pmid = "28263959"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 300
exist = ["salmon", "ldd", "locale", "ps", "gzip", "od", "awk", "cmp", "cp", "sed", "find", "wc", "sh", "mktemp", "tail", "mkfifo"]
test = ["sh /opt/salmon/share/salmon-smoke.sh interfaces", "sh /opt/salmon/share/salmon-smoke.sh index", "sh /opt/salmon/share/salmon-smoke.sh compatibility", "sh /opt/salmon/share/salmon-smoke.sh quant", "sh /opt/salmon/share/salmon-smoke.sh pool", "sh /opt/salmon/share/salmon-smoke.sh sketch", "sh /opt/salmon/share/salmon-smoke.sh merge", "sh /opt/salmon/share/salmon-smoke.sh alevin", "sh /opt/salmon/share/salmon-smoke.sh alignment", "sh /opt/salmon/share/salmon-smoke.sh genome", "sh /opt/salmon/share/salmon-smoke.sh accel", "sh /opt/salmon/share/salmon-smoke.sh bam", "sh /opt/salmon/share/salmon-smoke.sh rad", "sh /opt/salmon/share/salmon-smoke.sh radv2", "sh /opt/salmon/share/salmon-smoke.sh deterministic", "sh /opt/salmon/share/salmon-smoke.sh skip", "sh /opt/salmon/share/salmon-smoke.sh streams", "sh /opt/salmon/share/salmon-smoke.sh validation", "sh /opt/salmon/share/salmon-smoke.sh alignment-streams", "sh /opt/salmon/share/salmon-smoke.sh release212"]
